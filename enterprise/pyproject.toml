[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dv-platform-enterprise"
version = "1.0.0rc3"
description = "Private Enterprise extensions for dv-platform"
requires-python = ">=3.11,<3.14"
dependencies = ["dv-platform==1.0.0rc3"]

[project.scripts]
dv-enterprise = "dv_platform_enterprise.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dv_platform_enterprise"]

[tool.hatch.build.targets.wheel.force-include]
"../src/dv_platform/enterprise" = "dv_platform_enterprise_impl"
"../schemas/enterprise" = "dv_platform_enterprise/schemas"

[project.entry-points."dv_platform.simulator_runner"]
questa = "dv_platform_enterprise.adapters:QuestaSimulatorRunner"
vcs = "dv_platform_enterprise.adapters:VCSSimulatorRunner"
xcelium = "dv_platform_enterprise.adapters:XceliumSimulatorRunner"
riviera_pro = "dv_platform_enterprise.adapters:RivieraProSimulatorRunner"
vivado_xsim = "dv_platform_enterprise.adapters:VivadoXSimSimulatorRunner"

[project.entry-points."dv_platform.formal_runner"]
jaspergold = "dv_platform_enterprise.adapters:JasperGoldFormalRunner"
vc_formal = "dv_platform_enterprise.adapters:VCFormalRunner"
questa_formal = "dv_platform_enterprise.adapters:QuestaFormalRunner"

[project.entry-points."dv_platform.analyzer_runner"]
spyglass = "dv_platform_enterprise.adapters:SpyGlassAnalyzerRunner"
alint_pro = "dv_platform_enterprise.adapters:ALINTProAnalyzerRunner"

[project.entry-points."dv_platform.document_loader"]
local_documents = "dv_platform.enterprise.builtin_adapters:LocalDocumentLoader"
ocr_sidecar = "dv_platform.enterprise.builtin_adapters:OCRSidecarDocumentLoader"

[project.entry-points."dv_platform.report_exporter"]
json_manifest = "dv_platform.enterprise.builtin_adapters:JsonManifestReportExporter"

[project.entry-points."dv_platform.redaction_policy"]
regex = "dv_platform.enterprise.builtin_adapters:RegexRedactionPolicy"

[project.entry-points."dv_platform.semantic_importer"]
semantic_manifest = "dv_platform.enterprise.semantics:SemanticManifestImporter"

[project.entry-points."dv_platform.requirements_importer"]
requirements_manifest = "dv_platform.enterprise.requirements:RequirementsManifestImporter"

[project.entry-points."dv_platform.physical_evidence_importer"]
spyglass_cdc_rdc = "dv_platform_enterprise.physical:SpyGlassCDCRDCAdapter"
primetime_timing = "dv_platform_enterprise.physical:PrimeTimeTimingAdapter"
primetime_memory = "dv_platform_enterprise.physical:PrimeTimeMemoryAdapter"
primepower_power = "dv_platform_enterprise.physical:PrimePowerAdapter"
jaspergold_cdc_rdc = "dv_platform_enterprise.physical:JasperGoldCDCRDCAdapter"
tempus_timing = "dv_platform_enterprise.physical:TempusTimingAdapter"
tempus_memory = "dv_platform_enterprise.physical:TempusMemoryAdapter"
voltus_power = "dv_platform_enterprise.physical:VoltusPowerAdapter"
