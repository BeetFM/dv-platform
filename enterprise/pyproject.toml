[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dv-platform-enterprise"
version = "1.0.0rc3"
description = "Private Enterprise extensions for dv-platform"
requires-python = ">=3.11,<3.14"
dependencies = ["dv-platform==1.0.0rc3"]

[project.scripts]
dv-enterprise = "dv_platform_enterprise.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dv_platform_enterprise"]

[tool.hatch.build.targets.wheel.force-include]
"../src/dv_platform/enterprise" = "dv_platform_enterprise_impl"
"../schemas/enterprise" = "dv_platform_enterprise/schemas"

[project.entry-points."dv_platform.analyzer_runner"]
openroad = "dv_platform_enterprise.adapters:OpenROADRunner"

[project.entry-points."dv_platform.physical_evidence_importer"]
openroad = "dv_platform_enterprise.physical:OpenROADPhysicalEvidenceAdapter"
