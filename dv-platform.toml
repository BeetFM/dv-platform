# OpenROAD physical-design project settings.
[paths]
repo_root = "."
work_dir = ".dv-platform"
output_dir = ".dv-platform/exports"

[policy]
allow_network = false
strict = false
ci = false

[product]
required_physical_domains = ["asic_timing"]
require_production_signoff = true
signoff_trust_policy_path = "/etc/dv-platform/signoff-trust.json"

[ai]
model = "openai/responses/gpt-6-luna"
api_key_env = "API_KEY"
allowed_stages = ["physical_design"]

[context_optimization]
headroom_mode = "off"
code_graph_mode = "off"
stages = ["physical_design"]
