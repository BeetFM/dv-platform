[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dv-platform"
version = "0.1.0"
description = "Agentic RTL verification generation platform"
requires-python = ">=3.11,<3.14"
readme = "README.md"
license = { text = "Proprietary" }
authors = [
  { name = "dv-platform contributors" }
]
keywords = ["rtl", "verification", "cocotb", "formal", "verilog", "systemverilog"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "cocotb>=1.9,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dv_platform"]

[tool.dv-platform.system-dependencies]
executables = ["verilator", "iverilog", "sby", "yosys", "z3"]
apt = ["verilator", "iverilog"]

[project.scripts]
dv-platform = "dv_platform.cli:main"
