[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dv-platform"
version = "0.1.0"
description = "Agentic RTL verification generation platform"
requires-python = ">=3.11,<3.14"
readme = "README.md"
license = { text = "Proprietary" }
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [
  { name = "dv-platform contributors" }
]
keywords = ["rtl", "verification", "cocotb", "formal", "verilog", "systemverilog"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "cocotb>=1.9,<3",
  "defusedxml>=0.7,<1",
  "Jinja2>=3.1.6,<4",
  "pypdf>=6.12,<7",
]

[project.optional-dependencies]
ai = [
  "litellm>=1.93,<2",
]

[dependency-groups]
dev = [
  "click>=8.1,<9",
  "coverage[toml]>=7.10,<8",
  "mypy>=1.18,<2",
  "pip-audit>=2.9,<3",
  "ruff>=0.13,<1",
  "types-defusedxml>=0.7,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dv_platform"]

[tool.hatch.build.targets.wheel.force-include]
"schemas/rtl/cross-language-bindings-v1.schema.json" = "dv_platform/schemas/cross-language-bindings-v1.schema.json"
"schemas/rtl/dvsem-v2.schema.json" = "dv_platform/schemas/dvsem-v2.schema.json"
"schemas/verification/coverage-v3.schema.json" = "dv_platform/schemas/coverage-v3.schema.json"
"schemas/verification/protocol-profile-v1.schema.json" = "dv_platform/schemas/protocol-profile-v1.schema.json"
"schemas/verification/protocol-trace-v1.schema.json" = "dv_platform/schemas/protocol-trace-v1.schema.json"
"schemas/verification/requirements-v1.schema.json" = "dv_platform/schemas/requirements-v1.schema.json"
"schemas/enterprise/enterprise-result-v1.schema.json" = "dv_platform/schemas/enterprise-result-v1.schema.json"
"schemas/enterprise/external-design-evidence-v1.schema.json" = "dv_platform/schemas/external-design-evidence-v1.schema.json"
"schemas/qualification/ga-evidence-v1.schema.json" = "dv_platform/schemas/ga-evidence-v1.schema.json"
"schemas/qualification/ga-gates-v1.schema.json" = "dv_platform/schemas/ga-gates-v1.schema.json"
"schemas/qualification/qualification-gate-v2.schema.json" = "dv_platform/schemas/qualification-gate-v2.schema.json"
"schemas/qualification/performance-qualification-v1.schema.json" = "dv_platform/schemas/performance-qualification-v1.schema.json"
"schemas/qualification/performance-qualification-v2.schema.json" = "dv_platform/schemas/performance-qualification-v2.schema.json"
"schemas/qualification/performance-qualification-v3.schema.json" = "dv_platform/schemas/performance-qualification-v3.schema.json"
"schemas/qualification/pilot-evidence-v1.schema.json" = "dv_platform/schemas/pilot-evidence-v1.schema.json"
"schemas/qualification/qualification-signature-v1.schema.json" = "dv_platform/schemas/qualification-signature-v1.schema.json"
"schemas/qualification/qualification-trust-policy-v1.schema.json" = "dv_platform/schemas/qualification-trust-policy-v1.schema.json"
"schemas/qualification/qualification-v1.schema.json" = "dv_platform/schemas/qualification-v1.schema.json"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["B", "C90", "E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.mypy]
python_version = "3.11"
files = ["src/dv_platform"]
check_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
show_error_codes = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true

[tool.coverage.run]
branch = true
source = ["dv_platform"]

[tool.coverage.report]
fail_under = 84
show_missing = true
skip_covered = true

[tool.dv-platform.system-dependencies]
executables = ["verilator", "iverilog", "sby", "yosys", "z3"]
apt = ["verilator", "iverilog", "yosys", "z3"]

[project.scripts]
dv-platform = "dv_platform.cli:main"
dv-enterprise = "dv_platform.enterprise.cli:main"

[project.entry-points."dv_platform.coverage_importer"]
ucis_xml = "dv_platform.analysis.ucis:UCISXMLCoverageImporter"

[project.entry-points."dv_platform.document_loader"]
local_documents = "dv_platform.enterprise.builtin_adapters:LocalDocumentLoader"
ocr_sidecar = "dv_platform.enterprise.builtin_adapters:OCRSidecarDocumentLoader"

[project.entry-points."dv_platform.embedding_provider"]
local_hash = "dv_platform.analysis.docs:LocalHashEmbeddingProvider"

[project.entry-points."dv_platform.vector_store"]
local_json = "dv_platform.analysis.docs:LocalJsonVectorStore"

[project.entry-points."dv_platform.report_exporter"]
json_manifest = "dv_platform.enterprise.builtin_adapters:JsonManifestReportExporter"

[project.entry-points."dv_platform.redaction_policy"]
regex = "dv_platform.enterprise.builtin_adapters:RegexRedactionPolicy"

[project.entry-points."dv_platform.semantic_importer"]
semantic_manifest = "dv_platform.enterprise.semantics:SemanticManifestImporter"

[project.entry-points."dv_platform.requirements_importer"]
requirements_manifest = "dv_platform.enterprise.requirements:RequirementsManifestImporter"

[project.entry-points."dv_platform.simulator_runner"]
questa = "dv_platform.enterprise.adapters:QuestaSimulatorRunner"
vcs = "dv_platform.enterprise.adapters:VCSSimulatorRunner"
xcelium = "dv_platform.enterprise.adapters:XceliumSimulatorRunner"
riviera_pro = "dv_platform.enterprise.adapters:RivieraProSimulatorRunner"
vivado_xsim = "dv_platform.enterprise.adapters:VivadoXSimSimulatorRunner"

[project.entry-points."dv_platform.formal_runner"]
jaspergold = "dv_platform.enterprise.adapters:JasperGoldFormalRunner"
vc_formal = "dv_platform.enterprise.adapters:VCFormalRunner"
questa_formal = "dv_platform.enterprise.adapters:QuestaFormalRunner"

[project.entry-points."dv_platform.analyzer_runner"]
spyglass = "dv_platform.enterprise.adapters:SpyGlassAnalyzerRunner"
alint_pro = "dv_platform.enterprise.adapters:ALINTProAnalyzerRunner"
