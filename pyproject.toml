[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dv-platform"
version = "1.0.0rc3"
description = "ASIC physical-design execution and AI timing repair for OpenROAD"
requires-python = ">=3.11,<3.14"
readme = "README.md"
license = { text = "Proprietary" }
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [
  { name = "dv-platform contributors" }
]
keywords = ["asic", "physical-design", "openroad", "opensta", "timing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
]
dependencies = []

[project.optional-dependencies]
ai = [
  "litellm==1.103.1",
  "tenacity>=9.1,<10",
]

[dependency-groups]
dev = [
  "coverage[toml]>=7.10,<8",
  "mypy>=1.18,<2",
  "jsonschema>=4.23,<5",
  "pip-audit>=2.9,<3",
  "ruff>=0.13,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dv_platform"]
exclude = [
  "src/dv_platform/enterprise/**",
]

[tool.hatch.build.targets.wheel.force-include]
"compat/dv_platform/enterprise/__init__.py" = "dv_platform/enterprise/__init__.py"
"schemas/ai/routing-policy-v1.schema.json" = "dv_platform/schemas/routing-policy-v1.schema.json"
"schemas/signoff" = "dv_platform/schemas/signoff"

[tool.hatch.build.targets.sdist]
exclude = [
  "/enterprise",
  "/schemas/enterprise",
  "/src/dv_platform/enterprise",
  "/tests/enterprise",
]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["qualification/evidence"]

[tool.ruff.lint]
select = ["B", "C90", "E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.mypy]
python_version = "3.11"
files = ["src/dv_platform", "enterprise/src"]
check_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
show_error_codes = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true

[tool.coverage.run]
branch = true
source = ["dv_platform"]

[tool.coverage.report]
fail_under = 84
show_missing = true
skip_covered = true

[tool.dv-platform.system-dependencies]
executables = ["openroad", "sta", "yosys", "magic", "klayout", "netgen", "openssl"]
apt = ["yosys", "openssl"]

[project.scripts]
dv-platform = "dv_platform.cli:main"
