name: OpenROAD platform checks
on: [pull_request, push]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --all-groups --extra ai --frozen
      - run: uv run ruff check src enterprise/src tests scripts
      - run: uv run ruff format --check src enterprise/src tests scripts
      - run: uv run mypy
      - run: uv run python -m scripts.checks.repository_contracts
      - run: uv run python -m scripts.checks.maintainability --check
      - run: uv run python -m scripts.checks.compatibility --check
      - run: uv run python -m scripts.checks.secrets
      - name: Unit tests and coverage gates
        run: |
          uv run coverage run -m unittest discover -s tests -v
          uv run coverage json -o .dv-platform/python-coverage.json
          uv run python -m scripts.checks.branch_coverage .dv-platform/python-coverage.json
      - name: Build public and entitled distributions
        run: |
          uv build --wheel --out-dir .dv-platform/build/free
          uv build --wheel --project enterprise --out-dir .dv-platform/build/enterprise
          uv run python -m scripts.release.sbom .dv-platform/build/sbom.spdx.json
      - run: uv run pip-audit --skip-editable
